apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://hra-monitor-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://hra-monitor-alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
