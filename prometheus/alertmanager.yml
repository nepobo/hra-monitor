# Default receiver is a no-op so Alertmanager can start without SMTP/Telegram.
# To enable email or Telegram, copy the commented blocks and reboot the accessory:
#   bin/kamal accessory reboot alertmanager
#
# Telegram (free): create a bot via @BotFather, get chat id via @userinfobot.
# Email: any SMTP relay (Mailgun, Fastmail, etc.).

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, app]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # email_configs:
    #   - to: alerts@example.com
    #     from: monitor@example.com
    #     smarthost: smtp.example.com:587
    #     auth_username: monitor@example.com
    #     auth_password: change-me
    #     require_tls: true
    # telegram_configs:
    #   - bot_token: change-me
    #     chat_id: 123456789
    #     parse_mode: HTML
    #     send_resolved: true
    #     message: |
    #       {{ .Status | toUpper }} {{ .CommonLabels.alertname }}
    #       app={{ .CommonLabels.app }}
    #       {{ range .Alerts }}{{ .Annotations.summary }}
    #       {{ end }}

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, app]
