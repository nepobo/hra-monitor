global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - hra-monitor-alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - hra-monitor-alertmanager:9093

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - hra-monitor-blackbox:9115

  - job_name: rails
    metrics_path: /metrics
    bearer_token_file: /tmp/metrics_token
    tls_config:
      insecure_skip_verify: false
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/rails.yml
        refresh_interval: 30s

  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/nodes.yml
        refresh_interval: 30s

  - job_name: blackbox
    metrics_path: /probe
    scrape_interval: 30s
    params:
      module:
        - http_2xx
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/blackbox.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: hra-monitor-blackbox:9115
